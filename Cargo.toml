[package]
name = "zellij-workspaces"
version = "0.3.0"
edition = "2021"
description = "Zellij sidebar: one session per jj workspace / git worktree, grouped by project"
license = "MIT"

[dependencies]
zellij-tile = "=0.44.2"

[dev-dependencies]
# parse generated keybinding KDL with zellij's own config parser
zellij-utils = "=0.44.2"

[profile.release]
opt-level = "s"
lto = true
